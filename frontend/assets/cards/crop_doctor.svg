<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8E7C9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F8E7C9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgGrad)"/>
  <circle cx="200" cy="120" r="110" fill="url(#sunGrad)"/>
  
  <!-- Plant Leaves & Stem -->
  <path d="M200 210 Q200 130 200 90" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Left Leaf -->
  <path d="M200 150 Q130 140 120 90 Q170 100 200 130 Z" fill="#34D399" stroke="#F8E7C9" stroke-width="3"/>
  <path d="M200 145 Q150 125 125 95" stroke="#064E3B" stroke-width="2" fill="none"/>
  <!-- Right Leaf -->
  <path d="M200 125 Q270 115 285 65 Q235 75 200 105 Z" fill="#10B981" stroke="#F8E7C9" stroke-width="3"/>
  <path d="M200 120 Q250 100 280 70" stroke="#064E3B" stroke-width="2" fill="none"/>
  <!-- Center Top Bud -->
  <path d="M200 90 Q175 50 200 35 Q225 50 200 90 Z" fill="#F8E7C9"/>

  <!-- AI Scanner Reticle overlay -->
  <rect x="70" y="30" width="260" height="180" rx="16" fill="none" stroke="#F8E7C9" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="200" cy="110" r="45" fill="none" stroke="#F8E7C9" stroke-width="3"/>
  <line x1="140" y1="110" x2="260" y2="110" stroke="#F8E7C9" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="200" y1="50" x2="200" y2="170" stroke="#F8E7C9" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- AI Badge -->
  <rect x="290" y="20" width="90" height="30" rx="15" fill="#F8E7C9"/>
  <text x="335" y="40" fill="#064E3B" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle">AI SCAN</text>
</svg>
