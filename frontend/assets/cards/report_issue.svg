<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="repGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#repGrad)"/>

  <!-- Street Lamp Pole -->
  <line x1="110" y1="210" x2="110" y2="70" stroke="#F8E7C9" stroke-width="5"/>
  <path d="M110 70 Q110 40 140 40 L160 40" stroke="#F8E7C9" stroke-width="5" fill="none"/>
  <polygon points="150,40 170,40 165,55 155,55" fill="#F8E7C9"/>
  <!-- Light Glow -->
  <polygon points="150,55 170,55 210,140 110,140" fill="#F8E7C9" opacity="0.25"/>

  <!-- Water Tap Pipe & Drop -->
  <rect x="70" y="160" width="15" height="50" fill="#F8E7C9"/>
  <path d="M70 160 L45 160 L45 180" stroke="#F8E7C9" stroke-width="6" fill="none"/>
  <path d="M45 195 Q40 210 45 215 Q50 210 45 195 Z" fill="#60A5FA"/>

  <!-- Grievance Clipboard & Pen in Foreground -->
  <rect x="220" y="55" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#F8E7C9" stroke-width="4"/>
  <rect x="255" y="45" width="60" height="18" rx="6" fill="#D97706"/>
  <circle cx="285" cy="54" r="3" fill="#FFFFFF"/>
  <!-- Lines on Clipboard -->
  <line x1="240" y1="85" x2="330" y2="85" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="105" x2="310" y2="105" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="125" x2="330" y2="125" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="145" x2="290" y2="145" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

  <!-- Exclamation Alert Badge -->
  <circle cx="320" cy="170" r="24" fill="#DC2626"/>
  <text x="320" y="180" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">!</text>
</svg>
