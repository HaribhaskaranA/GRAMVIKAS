<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="astGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#astGrad)"/>

  <!-- Glowing Soundwaves Circle -->
  <circle cx="200" cy="115" r="95" fill="none" stroke="#F8E7C9" stroke-width="2" opacity="0.2"/>
  <circle cx="200" cy="115" r="75" fill="none" stroke="#F8E7C9" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="115" r="55" fill="#F8E7C9"/>

  <!-- Headphone Arc -->
  <path d="M145 125 A 55 55 0 0 1 255 125" stroke="#064E3B" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Headphone Earcups -->
  <rect x="135" y="105" width="16" height="34" rx="8" fill="#064E3B"/>
  <rect x="249" y="105" width="16" height="34" rx="8" fill="#064E3B"/>
  <!-- Microphone Boom -->
  <path d="M145 130 Q145 155 180 155" stroke="#064E3B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="185" cy="155" r="7" fill="#DC2626"/>

  <!-- Sound Equalizer Bars at Bottom -->
  <rect x="130" y="195" width="8" height="20" rx="4" fill="#F8E7C9"/>
  <rect x="145" y="185" width="8" height="30" rx="4" fill="#F8E7C9"/>
  <rect x="160" y="175" width="8" height="40" rx="4" fill="#F8E7C9"/>
  <rect x="175" y="170" width="8" height="45" rx="4" fill="#F8E7C9"/>
  <rect x="190" y="165" width="8" height="50" rx="4" fill="#F8E7C9"/>
  <rect x="205" y="170" width="8" height="45" rx="4" fill="#F8E7C9"/>
  <rect x="220" y="175" width="8" height="40" rx="4" fill="#F8E7C9"/>
  <rect x="235" y="185" width="8" height="30" rx="4" fill="#F8E7C9"/>
  <rect x="250" y="195" width="8" height="20" rx="4" fill="#F8E7C9"/>

  <!-- Bilingual Speech Bubble -->
  <rect x="280" y="25" width="105" height="40" rx="10" fill="#FFFFFF"/>
  <polygon points="295,65 310,65 300,75" fill="#FFFFFF"/>
  <text x="332" y="49" fill="#064E3B" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle">குரல் / தமிழ்</text>
</svg>
