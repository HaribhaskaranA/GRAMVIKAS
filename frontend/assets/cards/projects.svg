<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="projGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#projGrad)"/>

  <!-- Sun / Horizon -->
  <circle cx="200" cy="80" r="50" fill="#F8E7C9" opacity="0.3"/>

  <!-- Overhead Water Tank / Village Infrastructure -->
  <!-- Staging Legs -->
  <line x1="80" y1="180" x2="100" y2="80" stroke="#F8E7C9" stroke-width="4"/>
  <line x1="140" y1="180" x2="120" y2="80" stroke="#F8E7C9" stroke-width="4"/>
  <line x1="86" y1="130" x2="134" y2="130" stroke="#F8E7C9" stroke-width="3"/>
  <line x1="90" y1="150" x2="130" y2="110" stroke="#F8E7C9" stroke-width="2"/>
  <line x1="90" y1="110" x2="130" y2="150" stroke="#F8E7C9" stroke-width="2"/>
  <!-- Tank Body -->
  <rect x="75" y="45" width="70" height="40" rx="6" fill="#F8E7C9"/>
  <path d="M75 55 Q110 40 145 55" stroke="#064E3B" stroke-width="2" fill="none"/>

  <!-- Paved Road with Yellow Markers -->
  <polygon points="170,240 290,240 230,120 210,120" fill="#334155"/>
  <line x1="230" y1="240" x2="220" y2="130" stroke="#F8E7C9" stroke-width="4" stroke-dasharray="16 12"/>

  <!-- Construction Crane & Work progress sign -->
  <rect x="290" y="70" width="8" height="110" fill="#F8E7C9"/>
  <line x1="260" y1="70" x2="350" y2="70" stroke="#F8E7C9" stroke-width="4"/>
  <line x1="290" y1="70" x2="330" y2="105" stroke="#F8E7C9" stroke-width="2"/>
  <circle cx="330" cy="115" r="8" fill="#F8E7C9"/>

  <!-- 13 STAGES Progress Pill -->
  <rect x="260" y="25" width="125" height="28" rx="14" fill="#F8E7C9"/>
  <text x="322" y="44" fill="#064E3B" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">13-STAGE TRACK</text>
</svg>
