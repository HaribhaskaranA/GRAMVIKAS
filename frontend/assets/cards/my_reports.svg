<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="myRepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#04392B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#myRepGrad)"/>

  <!-- Tracking Ticket Container -->
  <rect x="60" y="35" width="280" height="170" rx="14" fill="#FFFFFF" stroke="#F8E7C9" stroke-width="4"/>
  <!-- Cutout notches on sides for ticket appearance -->
  <circle cx="60" cy="120" r="14" fill="#04392B"/>
  <circle cx="340" cy="120" r="14" fill="#04392B"/>
  <line x1="90" y1="120" x2="310" y2="120" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Top Ticket Header -->
  <text x="90" y="70" fill="#064E3B" font-family="monospace" font-weight="800" font-size="16">GV-REP-2026-88</text>
  <!-- Green Resolved Badge -->
  <rect x="235" y="52" width="75" height="24" rx="12" fill="#10B981"/>
  <text x="272" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">ACTIVE</text>

  <!-- 3 Stage Dots in Timeline -->
  <!-- Step 1 Complete -->
  <circle cx="110" cy="160" r="14" fill="#10B981"/>
  <polyline points="105,160 108,164 116,155" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Line 1-2 -->
  <line x1="124" y1="160" x2="186" y2="160" stroke="#10B981" stroke-width="4"/>
  <!-- Step 2 In Progress -->
  <circle cx="200" cy="160" r="14" fill="#F59E0B"/>
  <circle cx="200" cy="160" r="6" fill="#FFFFFF"/>
  <!-- Line 2-3 -->
  <line x1="214" y1="160" x2="276" y2="160" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Step 3 Pending -->
  <circle cx="290" cy="160" r="14" fill="#CBD5E1"/>

  <!-- Labels -->
  <text x="110" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">பதிவு</text>
  <text x="200" y="190" fill="#064E3B" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">ஆய்வு</text>
  <text x="290" y="190" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">தீர்வு</text>
</svg>
