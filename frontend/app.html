<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAMVIKAS AI - Rural Governance Platform</title>
  <meta name="description" content="Every Citizen Informed. Every Village Progress Tracked.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpeg">
  
  <!-- Google Fonts: Inter, Noto Sans Tamil, Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3 CDN & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Leaflet.js CSS for GIS Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- App Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body class="font-md">

  <div class="app-shell">
    <!-- Desktop Persistent Sidebar -->
    <nav class="app-sidebar" id="app-sidebar" aria-label="Main Navigation">
      <!-- Injected dynamically by navbar.js -->
    </nav>

    <!-- Mobile Drawer Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Content Layout Area -->
    <div class="app-main">
      <!-- Sticky Topbar Header -->
      <header class="app-topbar" id="app-topbar">
        <!-- Injected dynamically by navbar.js -->
      </header>

      <!-- Dynamic Page View Container -->
      <main class="app-content" id="app-content" role="main">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border text-primary mb-2" style="color: var(--color-primary) !important;"></div>
          <div style="color: var(--color-primary); font-weight: 600;">Initializing GRAMVIKAS AI...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Mobile 5-Item Fixed Bottom Navigation Bar -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile Navigation">
    <!-- Injected dynamically by navbar.js -->
  </nav>

  <!-- Leaflet.js Script -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Application Bootstrap Script -->
  <script type="module">
    import { router } from "/js/router.js";
    import { applyLanguage } from "/js/i18n.js";

    window.addEventListener("DOMContentLoaded", () => {
      applyLanguage();
      router.handleCurrentRoute();
    });
  </script>
</body>
</html>
